CONFIG_PRINTK=y
CONFIG_LOG=y
CONFIG_LOG_MODE_IMMEDIATE=y
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BACKEND_FORMAT_TIMESTAMP=y
CONFIG_LOG_OUTPUT_FORMAT_TIME_TIMESTAMP=y
CONFIG_SERIAL=y
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Reserve internal SRAM for USB and the WAMR execution thread; WAMR heap data uses PSRAM.
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=65536
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_SHELL_STACK_SIZE=8192

# Virtual /dev filesystem for GPIO/LED device access
CONFIG_WEBOS_DEVFS=y
CONFIG_WEBOS_GPIO=y
CONFIG_LED_STRIP=y
CONFIG_WEBOS_RGBLED=y

# FatFS-backed WebOS volume on the storage flash partition.
CONFIG_DISK_ACCESS=y
CONFIG_DISK_DRIVERS=y
CONFIG_FILE_SYSTEM=y
CONFIG_FILE_SYSTEM_MAX_TYPES=3
CONFIG_FILE_SYSTEM_SHELL=y
CONFIG_FILE_SYSTEM_SHELL_MOUNT_COMMAND=y
CONFIG_FILE_SYSTEM_MKFS=y
CONFIG_FAT_FILESYSTEM_ELM=y
CONFIG_FS_FATFS_LFN=y
CONFIG_FS_FATFS_LFN_MODE_STACK=y
CONFIG_FS_FATFS_MOUNT_MKFS=y

# OTA firmware updates through POST /ota into the MCUboot secondary slot.
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_FLASH=y
CONFIG_FLASH_MAP=y
CONFIG_IMG_MANAGER=y
CONFIG_MCUBOOT_IMG_MANAGER=y
CONFIG_STREAM_FLASH=y
CONFIG_STREAM_FLASH_ERASE=y
CONFIG_IMG_ERASE_PROGRESSIVELY=y
CONFIG_IMG_BLOCK_BUF_SIZE=4096
CONFIG_REBOOT=y

# PSRAM (ESP32-S3 N16R8: 8MB octal PSRAM)
CONFIG_ESP_SPIRAM=y
CONFIG_SPIRAM_MODE_OCT=y
CONFIG_SPIRAM_TYPE_ESPPSRAM64=y
CONFIG_ESP_SPIRAM_HEAP_SIZE=2097152

# Shell command execution for local UART shell and trusted POST /shell.
CONFIG_SHELL=y
CONFIG_SHELL_BACKEND_SERIAL=y
CONFIG_SHELL_BACKEND_SERIAL_LOG_LEVEL_NONE=y
CONFIG_SHELL_METAKEYS=y
CONFIG_SHELL_HISTORY=y
CONFIG_SETTINGS=y
CONFIG_SETTINGS_FILE=y
CONFIG_SETTINGS_FILE_PATH="/STORAGE:/settings.conf"
CONFIG_SHELL_BACKEND_DUMMY=y
CONFIG_SHELL_BACKEND_DUMMY_BUF_SIZE=1024
CONFIG_WEBOS_LOG_BUFFER=y

# Basic HTTP management server.
CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_TCP=y
CONFIG_NET_UDP=y
CONFIG_NET_SOCKETS=y
CONFIG_ZVFS_OPEN_MAX=16
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y
CONFIG_NET_MGMT_EVENT_INFO=y
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=10
CONFIG_NET_MGMT_EVENT_STACK_SIZE=4096
CONFIG_NET_DHCPV4=y
CONFIG_NET_CONNECTION_MANAGER=y
CONFIG_WIFI=y
CONFIG_WIFI_NM=y
CONFIG_WIFI_USAGE_MODE_STA=y
CONFIG_NET_L2_WIFI_MGMT=y
CONFIG_NET_SHELL=y
CONFIG_NET_L2_WIFI_SHELL=y
CONFIG_NET_MGMT_EVENT_QUEUE_TIMEOUT=5000
CONFIG_NET_MGMT_EVENT_QUEUE_SIZE=16
CONFIG_HTTP_SERVER=y
# HTTP_SERVER_CAPTURE_HEADERS=y enables the server to capture custom headers.
CONFIG_HTTP_SERVER_MAX_CLIENTS=1
CONFIG_HTTP_SERVER_STACK_SIZE=8192
CONFIG_HTTP_SERVER_CLIENT_BUFFER_SIZE=4096
CONFIG_HTTP_SERVER_CAPTURE_HEADERS=y

# Outbound HTTP/HTTPS requests exposed to WASM applications.
CONFIG_HTTP_CLIENT=y
CONFIG_HTTP_CLIENT_SEND_BUF_SIZE=512
CONFIG_DNS_RESOLVER=y
CONFIG_NET_SOCKETS_SOCKOPT_TLS=y
CONFIG_NET_SOCKETS_TLS_MAX_CONTEXTS=1
CONFIG_TLS_CREDENTIALS=y
CONFIG_TLS_CREDENTIALS_BACKEND_VOLATILE=y
CONFIG_TLS_MAX_CREDENTIALS_NUMBER=2
CONFIG_MBEDTLS_SSL_PROTO_TLS1_2=y
CONFIG_MBEDTLS_SSL_SERVER_NAME_INDICATION=y
CONFIG_MBEDTLS_PSA_KEY_SLOT_COUNT=4
CONFIG_PSA_WANT_KEY_TYPE_RSA_PUBLIC_KEY=y
CONFIG_MBEDTLS_CIPHERSUITE_TLS_ECDHE_RSA_WITH_AES_128_GCM_SHA256=y
CONFIG_MBEDTLS_SSL_IN_CONTENT_LEN=4096
CONFIG_MBEDTLS_SSL_OUT_CONTENT_LEN=2048

CONFIG_NET_PKT_RX_COUNT=32
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_BUF_DATA_SIZE=256

# POSIX API for WAMR WASI sandboxed-system-primitives
CONFIG_POSIX_API=y

# WAMR / iwasm runtime for WASM payload execution
CONFIG_WAMR_MICRO_RUNTIME=y
CONFIG_WAMR_BUILD_TARGET="XTENSA"
CONFIG_WAMR_BUILD_INTERP=y
CONFIG_WAMR_BUILD_AOT=y
CONFIG_WAMR_BUILD_LIBC_BUILTIN=y
# CONFIG_WAMR_BUILD_LIBC_WASI=y
CONFIG_WAMR_BUILD_FAST_INTERP=n
# Use system allocator directly (no global pool)
CONFIG_WAMR_BUILD_GLOBAL_HEAP_POOL=n

CONFIG_WEBOS_WIFI_SSID=""
CONFIG_WEBOS_WIFI_PSK=""

# Development-only, unauthenticated ADB over the native ESP32-S3 USB port.
CONFIG_USB_DEVICE_STACK_NEXT=y
CONFIG_CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=n
CONFIG_HWINFO=y
CONFIG_UDC_BUF_POOL_SIZE=2048
CONFIG_UDC_DWC2_DMA=n
CONFIG_UDC_DRIVER_LOG_LEVEL_WRN=y
CONFIG_WEBOS_ADB=y
CONFIG_WEBOS_ADB_USB=y
CONFIG_WEBOS_ADB_ALLOW_NO_AUTH=y
CONFIG_WEBOS_SHELL_EXEC=y
CONFIG_WEBOS_ADB_SHELL=y
CONFIG_WEBOS_ADB_SYNC=y
CONFIG_WEBOS_ADB_REBOOT=y
